name: Nooklet
options:
  bundleIdPrefix: ai.tokkong.nemotron
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad

packages:
  LiteRTLM:
    path: ../LiteRT-LM

targets:
  Nooklet:
    type: application
    platform: iOS
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    sources:
      - path: Nooklet
      # Models/ is referenced as a folder (not compiled) so .mlmodelc bundles
      # are copied as resources when present, and the app builds without them.
      - path: Models
        type: folder
        optional: true
    info:
      path: Nooklet/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nooklet
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Microphone access is required to capture speech for on-device transcription."
        UIBackgroundModes:
          - audio
        # Let users drop audio files into the app's Documents via the Files app
        # (in addition to importing in-place through the file picker).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokkong.nemotron.poc
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  NookletTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NookletTests
    dependencies:
      - target: Nooklet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tokkong.nemotron.poc.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nooklet:
    build:
      targets:
        Nooklet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NookletTests
